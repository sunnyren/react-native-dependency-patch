<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYS_LETTER_VERIFICATION</title>
    <style>
        body { 
            background-color: #121212; 
            color: #E0E0E0; 
            font-family: 'Courier New', Courier, monospace; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px 0; 
            box-sizing: border-box; 
        }
        .container { 
            text-align: center; 
            padding: 30px 20px; 
            border: 1px solid #333; 
            background: #1a1a1a; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
            max-width: 380px; 
            width: 90%; 
        }
        input { 
            background: #222; 
            border: 1px solid #555; 
            color: #fff; 
            padding: 12px; 
            text-align: center; 
            font-size: 16px; 
            border-radius: 4px; 
            margin-top: 15px; 
            width: 80%; 
            outline: none; 
            box-sizing: border-box; 
            font-family: inherit;
        }
        input:focus { border-color: #DAA520; } 
        .btn-submit { 
            background: #DAA520; 
            border: none; 
            color: #121212; 
            padding: 12px; 
            margin-top: 15px; 
            cursor: pointer; 
            font-weight: bold; 
            font-family: inherit; 
            font-size: 16px; 
            border-radius: 4px; 
            width: 80%; 
        }
        .btn-submit:active { background: #B8860B; }
        .error { color: #ff5555; margin-top: 15px; font-size: 13px; display: none; }
        .status { color: #888; font-size: 12px; margin-top: 10px; min-height: 18px; }

        .text-container {
            text-align: left;
            margin-top: 20px;
            padding: 15px;
            background: #0d0d0d;
            border-radius: 6px;
            border: 1px solid #333;
            line-height: 1.8;
            font-size: 15px;
            color: #DAA520;
            min-height: 120px;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .cursor {
            display: inline-block;
            width: 8px;
            height: 16px;
            background-color: #DAA520;
            margin-left: 2px;
            vertical-align: middle;
            animation: blink 0.8s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>

<div class="container" id="app">
    <div id="console">
        <h3>🔑 TEXT NODE ACCESS</h3>
        <p>ENTER DECRYPTION KEY TO CONNECT NODE</p>
        <input type="password" id="secret-key" pattern="[0-9]*" placeholder="输入密码..."><br>
        <button class="btn-submit" onclick="decryptAndShow()">CONNECT NODE</button>
        <p class="error" id="errorMsg">⚠ INVALID TOKEN. PERMISSION DENIED.</p>
        <p class="status" id="statusMsg"></p>
    </div>

    <div id="letter-container" style="display: none;">
        <h3 style="color: #DAA520; margin-bottom: 5px;">🔓 TEXT NODE CONNECTED</h3>
        <p style="font-size: 12px; color: #888; margin-top: 0;">DECRYPTING MEMORY STREAM...</p>
        
        <div class="text-container">
            <span id="typed-text"></span><span class="cursor" id="cursor"></span>
        </div>
    </div>
</div>

<script>
    function calcDiff(startStr, endStr) {
        let start = new Date(startStr);
        let end = endStr ? new Date(endStr) : new Date();
        
        let isFuture = start > end;
        if (isFuture) {
            let temp = start; start = end; end = temp;
        }

        let y1 = start.getFullYear(), m1 = start.getMonth(), d1 = start.getDate();
        let y2 = end.getFullYear(), m2 = end.getMonth(), d2 = end.getDate();

        let years = y2 - y1;
        let months = m2 - m1;
        let days = d2 - d1;

        if (days < 0) {
            months--;
            let prevMonthLastDay = new Date(y2, m2, 0).getDate();
            days += prevMonthLastDay;
        }
        if (months < 0) {
            years--;
            months += 12;
        }

        let totalMonths = years * 12 + months;

        return { years, months, days, totalMonths };
    }

    // 格式化时间文本（自动判断是否大于/小于一年）
    function formatTimeStr(diffObj) {
        if (diffObj.years < 1) {
            return `${diffObj.totalMonths} 个月 ${diffObj.days} 天`;
        } else {
            return `${diffObj.years} 年 ${diffObj.months} 个月 ${diffObj.days} 天`;
        }
    }

    async function decryptAndShow() {
        const key = document.getElementById('secret-key').value;
        const errorMsg = document.getElementById('errorMsg');
        const statusMsg = document.getElementById('statusMsg');
        
        statusMsg.innerText = "正在建立安全连接...";
        errorMsg.style.display = 'none';

        try {
            const cacheBuster = '?t=' + new Date().getTime();
            const response = await fetch('https://sunnyren.github.io/react-native-dependency-patch/letter-data.enc' + cacheBuster);
            if (!response.ok) throw new Error('无法获取加密节点');
            const cipherText = await response.text();

            statusMsg.innerText = "正在解密文字数据流...";
            
            const decryptedBytes = CryptoJS.AES.decrypt(cipherText, key);
            const decryptedPayload = decryptedBytes.toString(CryptoJS.enc.Utf8);

            if (!decryptedPayload) throw new Error('解密失败');

            const parts = decryptedPayload.split('|DATE_SPLIT|');
            const dates = parts[0].split(',');
            let letterContent = parts[1];

            // 1. 相遇至今 
            const diff1 = calcDiff(dates[0]);
            letterContent = letterContent.replace(/{{Y1}}/g, diff1.years)
                                         .replace(/{{M1}}/g, diff1.months)
                                         .replace(/{{D1}}/g, diff1.days);

            // 2. 重逢至今 - 智能格式
            const diff2 = calcDiff(dates[1]);
            letterContent = letterContent.replace(/{{TIME2}}/g, formatTimeStr(diff2));

            // 3. 距离未来 - 智能格式
            const diff3 = calcDiff(dates[2]);
            letterContent = letterContent.replace(/{{TIME3}}/g, formatTimeStr(diff3));

            statusMsg.innerText = "";
            document.getElementById('console').style.display = 'none';
            document.getElementById('letter-container').style.display = 'block';

            typeWriter(letterContent, 0);

        } catch (error) {
            console.error(error);
            statusMsg.innerText = "";
            errorMsg.style.display = 'block';
        }
    }

    function typeWriter(text, index) {
        if (index < text.length) {
            document.getElementById("typed-text").innerHTML += text.charAt(index);
            index++;
            setTimeout(() => typeWriter(text, index), 80); 
        }
    }
</script>
</body>
</html>
