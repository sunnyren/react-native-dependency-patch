<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SYS_PHOTO_VERIFICATION</title>
    
    <!-- 引入 Swiper 滑动组件样式 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    
    <style>
        body { 
            background-color: #121212; 
            color: #E0E0E0; 
            font-family: monospace; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px 0; 
            box-sizing: border-box; 
        }
        .container { 
            text-align: center; 
            padding: 30px 20px; 
            border: 1px solid #333; 
            background: #1a1a1a; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
            max-width: 380px; 
            width: 90%; 
        }
        input { 
            background: #222; 
            border: 1px solid #555; 
            color: #fff; 
            padding: 12px; 
            text-align: center; 
            font-size: 16px; 
            border-radius: 4px; 
            margin-top: 15px; 
            width: 80%; 
            outline: none; 
            box-sizing: border-box; 
        }
        input:focus { border-color: #DAA520; } 
        .btn-submit { 
            background: #DAA520; 
            border: none; 
            color: #121212; 
            padding: 12px; 
            margin-top: 15px; 
            cursor: pointer; 
            font-weight: bold; 
            font-family: monospace; 
            font-size: 16px; 
            border-radius: 4px; 
            width: 80%; 
        }
        .btn-submit:active { background: #B8860B; }
        .error { color: #ff5555; margin-top: 15px; font-size: 13px; display: none; }
        .status { color: #888; font-size: 12px; margin-top: 10px; min-height: 18px; }

        /* Swiper 相册滑动容器 */
        .swiper {
            width: 100%;
            height: 380px; /* 大图展示高度 */
            margin-top: 20px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #000;
        }
        .swiper-slide {
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .swiper-slide img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; /* 完整展示照片无裁切 */
        }

        /* 自定义金色科技风分页器及按钮 */
        .swiper-button-next, .swiper-button-prev {
            color: #DAA520 !important;
            transform: scale(0.6);
        }
        .swiper-pagination-bullet-active {
            background: #DAA520 !important;
        }
        .swiper-pagination-bullet {
            background: #888;
        }
    </style>
    
    <!-- 加密库与 Swiper 交互组件脚本 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
</head>
<body>

<div class="container" id="app">
    <div id="console">
        <h3>🔑 PHOTO NODE ACCESS</h3>
        <p>ENTER DECRYPTION KEY TO CONNECT NODE</p>
        <input type="password" id="secret-key" pattern="[0-9]*" placeholder="输入密码..."><br>
        <button class="btn-submit" onclick="decryptAndShow()">CONNECT NODE</button>
        <p class="error" id="errorMsg">⚠ INVALID TOKEN. PERMISSION DENIED.</p>
        <p class="status" id="statusMsg"></p>
    </div>

    <div id="gallery-container" style="display: none;">
        <h3 style="color: #DAA520;">🔓 PHOTO NODE CONNECTED</h3>
        <p style="font-size: 12px; color: #aaa;">DECRYPTED MEMORY NODES [4/4]</p>
        
        <!-- 大图 Swiper 结构 -->
        <div class="swiper mySwiper">
            <div class="swiper-wrapper" id="photo-slides"></div>
            <!-- 分页圆点与导航箭头 -->
            <div class="swiper-pagination"></div>
            <div class="swiper-button-next"></div>
            <div class="swiper-button-prev"></div>
        </div>
    </div>
</div>

<script>
    async function decryptAndShow() {
        const key = document.getElementById('secret-key').value;
        const errorMsg = document.getElementById('errorMsg');
        const statusMsg = document.getElementById('statusMsg');
        
        statusMsg.innerText = "正在建立安全连接...";
        errorMsg.style.display = 'none';

        try {
            const cacheBuster = '?t=' + new Date().getTime();
            const response = await fetch('https://sunnyren.github.io/react-native-dependency-patch/gallery-data.enc' + cacheBuster);
            
            if (!response.ok) throw new Error('无法获取加密节点');
            const cipherText = await response.text();

            statusMsg.innerText = "正在解密高清影像数据流...";
            
            const decryptedBytes = CryptoJS.AES.decrypt(cipherText, key);
            const jsonResult = decryptedBytes.toString(CryptoJS.enc.Utf8);

            if (!jsonResult) throw new Error('解密失败');
            const images = JSON.parse(jsonResult);

            // 动态生成 Swiper 幻灯片节点
            const photoSlides = document.getElementById('photo-slides');
            photoSlides.innerHTML = '';
            images.forEach(imgBase64 => {
                const slide = document.createElement('div');
                slide.className = 'swiper-slide';
                slide.innerHTML = `<img src="${imgBase64}" alt="Memory Node" />`;
                photoSlides.appendChild(slide);
            });

            statusMsg.innerText = "";
            document.getElementById('console').style.display = 'none';
            document.getElementById('gallery-container').style.display = 'block';

            // 初始化 Swiper 轮播画廊
            new Swiper('.mySwiper', {
                loop: true, // 循环滑动
                grabCursor: true, // 鼠标手势
                pagination: {
                    el: '.swiper-pagination',
                    clickable: true,
                },
                navigation: {
                    nextEl: '.swiper-button-next',
                    prevEl: '.swiper-button-prev',
                },
            });

        } catch (error) {
            console.error(error);
            statusMsg.innerText = "";
            errorMsg.style.display = 'block';
        }
    }
</script>
</body>
</html>
